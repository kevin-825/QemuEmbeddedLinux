# 1. Generate the Boot Partition (FAT32)
image boot.vfat {
    vfat {
        files = {
            "Image",           # The Linux Kernel
            "my_board.dtb",    # The Hardware Blueprint (Device Tree)
            "boot.scr",        # The U-Boot instruction script
            "extlinux.conf"    # Alternative boot menu config
        }
    }
    size = 64M
}

# 2. Generate the full SD Card Image
image sdcard.img {
    hdimage {
        partition-table-type = "gpt"  # Modern boards use GPT instead of MBR
    }

    # --- THE RAW BOOTLOADER SECTOR ---
    # Real boards often need the bootloader written directly to raw sectors
    # BEFORE the first actual partition starts.
    partition u-boot-spl {
        in-partition-table = "false"  # Hidden from the OS
        image = "u-boot-spl.bin"      # The First-Stage Bootloader
        offset = 2M                   # Write exactly at the 2 Megabyte mark
    }

    partition opensbi-uboot {
        in-partition-table = "false"
        image = "fw_payload.bin"      # OpenSBI + Second-Stage Bootloader
        offset = 4M
    }

    # --- THE MOUNTABLE PARTITIONS ---
    partition boot {
        partition-type-uuid = U       # Standard GPT UUID for EFI/Boot
        bootable = "true"
        image = "boot.vfat"
        offset = 16M                  # Start safely after the raw bootloaders
    }

    partition rootfs {
        partition-type-uuid = L       # Standard GPT UUID for Linux Root
        image = "rootfs.ext4"
    }
}