# /etc/mdev.conf (CORRECTED ORDER)

# 1. YOUR CUSTOM DRIVERS (Most specific, MUST go first)
my_sensor       root:root       0666
fpga_core_0     root:root       0600  >my_fpga

# 2. Hardware Categories (Medium specificity)
tty[0-9]* root:tty        0660
event[0-9]* root:root       0640  =input/

# 3. Catch-all Default (Must be at the absolute bottom!)
.* root:root       0600